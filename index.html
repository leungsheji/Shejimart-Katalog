<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheji Mart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #ffffff; --bg: #f8fafc; --footer: #1e293b; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin:0; padding-top: 100px; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { position: fixed; top: 0; width: 100%; background: #ffffff; z-index: 10000; border-bottom: 2px solid #edf2f7; height: 85px; }
        .header-wrap { display: flex; align-items: center; padding: 0 5%; gap: 20px; max-width: 1400px; margin: 0 auto; height: 100%; }
        .logo-area { flex-shrink: 0; display: flex; align-items: center; }
        .logo-area img { height: 75px; width: auto; object-fit: contain; }
        
        .nav-item { position: relative; flex-shrink: 0; }
        .btn-kategori { 
            background: var(--primary) !important; color: #ffffff !important; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; 
            cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; min-width: 150px; justify-content: center;
        }
        
        .mega-menu { 
            display: none; position: absolute; top: 100%; left: 0; background: #ffffff; min-width: 250px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; border-radius: 0 0 8px 8px; margin-top: 5px; 
        }
        .nav-item.show-menu .mega-menu { display: block; }
        .lvl-1 { position: relative; border-bottom: 1px solid #f1f5f9; }
        .lvl-1 a { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; text-decoration: none; color: #334155 !important; font-size: 13px; font-weight: 600; cursor: pointer; }
        .lvl-1:hover > a { background: #f8fafc; color: var(--primary) !important; }
        
        .search-area { flex-grow: 1; position: relative; min-width: 200px; }
        .search-area input { width: 100%; padding: 12px 15px 12px 45px; border-radius: 8px; border: 1px solid #d1d5db; outline: none; background: #f9fafb; }
        .search-area i { position: absolute; left: 16px; top: 14px; color: #9ca3af; }

        .container { max-width: 1400px; margin: 0 auto; padding: 10px 20px; flex: 1; width: 100%; }

        .bento-container { display: flex; gap: 20px; margin-bottom: 15px; width: 100%; }
        .slider-wrapper { flex: 7; position: relative; overflow: hidden; border-radius: 12px; }
        .slider-wrapper img { width: 100%; aspect-ratio: 21/9; max-height: 350px; object-fit: cover; border-radius: 12px; }
        .side-banners { flex: 3; display: flex; flex-direction: column; gap: 15px; }
        .side-banner img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 15px; cursor: pointer; transition: 0.3s; text-decoration: none; color: inherit; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; margin-bottom: 10px; }
        .card-title { font-size: 13px; font-weight: 600; margin: 0; height: 55px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }

        footer { background: var(--footer); color: #cbd5e1; padding: 40px 5% 20px; margin-top: 50px; }
        .ft-floor-1 { width: 100%; border-bottom: 1px solid #334155; padding-bottom: 25px; margin-bottom: 30px; }
        .ft-floor-2 { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.5fr; gap: 30px; max-width: 1400px; margin: 0 auto; }
        .ft-box h4 { color: #fff; margin-bottom: 20px; font-size: 16px; border-left: 3px solid #fff; padding-left: 15px; line-height: 1; }
        .ft-box p, .ft-box a { font-size: 14px; color: #cbd5e1; text-decoration: none; display: block; margin-bottom: 10px; }
        .ft-box a:hover { color: #fff; cursor: pointer; }
        .info-item { display: flex; gap: 10px; margin-bottom: 15px; font-size: 14px; align-items: flex-start; }
        .info-item i { color: #fff; margin-top: 4px; }
        .btn-maps-ft { background: var(--primary) !important; color: #fff !important; text-align: center; padding: 12px; border-radius: 6px; font-weight: 700; display: block; text-decoration: none; width: 100%; }
        .bottom-bar { text-align: center; border-top: 1px solid #334155; margin-top: 40px; padding-top: 20px; font-size: 12px; opacity: 0.6; }

        @media (max-width: 768px) {
            body { padding-top: 140px; }
            .header-wrap { flex-wrap: wrap; height: auto; padding: 10px; }
            .search-area { width: 100%; order: 3; }
            .ft-floor-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-wrap">
        <div class="logo-area">
                            <img src="https://scontent.fcgk33-1.fna.fbcdn.net/v/t39.30808-6/624198570_880283444966914_4381555066372612860_n.jpg?_nc_cat=110&amp;ccb=1-7&amp;_nc_sid=1d70fc&amp;_nc_eui2=AeG_fTwdP9RssOprpQ-l1RIBvrHYblWRiiq-sdhuVZGKKjhNdhacRlYdnYnlT4w94sk&amp;_nc_ohc=6ZM8ldpgrcYQ7kNvwG8A4gV&amp;_nc_oc=Adr4FLg4oZgI6uTvL0bRSC0qjz55Rd10OSjnXL_6hTJqfy2YT6BnLvKse8Vr3ZKi4IdeIWu508BG8uM7oUCHyqZb&amp;_nc_zt=23&amp;_nc_ht=scontent.fcgk33-1.fna&amp;_nc_gid=ksMn_6bp-H9B4pKgByD64A&amp;_nc_ss=7a3a8&amp;oh=00_Af283IjfJzTlROcNu3eUjp9H86TRYJT23ByZygYxNDmW8w&amp;oe=69D811CB" alt="Logo">
                    </div>
        <div class="nav-item" id="navBungkus">
            <button class="btn-kategori" onclick="toggleMenu(event)"><i class="fas fa-bars"></i> KATEGORI</button>
            <div class="mega-menu" id="menuKonten">
                                    <div class="lvl-1"><a>Kesehatan <i class="fas fa-chevron-right" style="font-size:10px"></i></a></div>
                            </div>
        </div>
        <div class="search-area">
            <i class="fas fa-search"></i>
            <input type="text" id="cari" placeholder="Cari produk..." onkeyup="filterCepat()">
        </div>
    </div>
</header>

<div class="container">
            <div class="bento-container">
            <div class="slider-wrapper full-width">
                <div class="slide" style="display:block"><img src="https://lh3.googleusercontent.com/d/188l9H6fSy5f4QypFQEghLBMMUw14qgLv"></div>
            </div>
                    </div>
    
    <div class="grid" id="produkGrid">
                    <a href="1-pack-isi-12-pcs-pasta-gigi-ciptadent-75-gram-edisi-beli-5-gratis-1/index.html" class="card" data-nama="1 pack isi 12 pcs pasta gigi ciptadent 75 gram edisi beli 5 gratis 1">
                <img src="https://down-id.img.susercontent.com/file/id-11134207-7ra0n-mb88ncm4fbh2a5@resize_w450_nl.webp" loading="lazy">
                <div class="card-title">1 PACK ISI 12 PCS PASTA GIGI CIPTADENT 75 GRAM EDISI BELI 5 GRATIS 1</div>
            </a>
            </div>
</div>

<footer>
    <div class="ft-floor-1"></div>
    <div class="ft-floor-2">
        <div class="ft-box">
            <h4>Sheji Mart</h4>
            <div><p>Grosir & Eceran Terpercaya.</p></div>
        </div> 
        <div class="ft-box"> 
            <h4>Bantuan</h4>
            <a onclick="location.reload()" style="cursor:pointer">Beranda</a>
            <a href="#">Cara Belanja</a>
            <a id="waFooter" href="https://wa.me/6285100331684" target="_blank">Hubungi Kami</a>
        </div>
        <div class="ft-box"> 
            <h4>Ikuti Kami</h4>
            <div id="socialArea">
                            </div>
        </div>
        <div class="ft-box"> 
            <h4>Info Toko</h4>
            <div class="info-item"><i class="fas fa-map-marker-alt"></i> <span>JL. BENDUNGAN JATILUHUR NO. 97, JAKARTA PUSAT</span></div>
            <div class="info-item"><i class="fas fa-clock"></i> <span>-</span></div>
            <a href="#" target="_blank" class="btn-maps-ft">Buka Google Maps</a>
        </div>
    </div>
    <div class="bottom-bar">&copy; 2026 Sheji Mart. All Rights Reserved.</div>
</footer>

<script>
    function toggleMenu(e) {
        e.stopPropagation();
        document.getElementById('navBungkus').classList.toggle('show-menu');
    }
    function filterCepat() {
        let k = document.getElementById('cari').value.toLowerCase();
        document.querySelectorAll('.card').forEach(card => {
            card.style.display = card.dataset.nama.includes(k) ? 'block' : 'none';
        });
    }
    window.onclick = () => document.getElementById('navBungkus').classList.remove('show-menu');
</script>
</body>
</html>
