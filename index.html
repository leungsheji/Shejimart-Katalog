<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheji Mart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #ffffff; --bg: #f8fafc; --footer: #1e293b; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin:0; padding-top: 100px; display: flex; flex-direction: column; min-height: 100vh; }
        header { position: fixed; top: 0; width: 100%; background: #ffffff; z-index: 10000; border-bottom: 2px solid #edf2f7; height: 85px; }
        .header-wrap { display: flex; align-items: center; padding: 0 5%; gap: 20px; max-width: 1400px; margin: 0 auto; height: 100%; }
        .logo-area img { height: 80px; width: auto; object-fit: contain; }
        .btn-kategori { background: var(--primary) !important; color: #ffffff !important; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .mega-menu { display: none; position: absolute; top: 100%; left: 0; background: #ffffff; min-width: 250px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border-radius: 0 0 8px 8px; }
        .nav-item.show-menu .mega-menu { display: block; }
        .lvl-1 { position: relative; border-bottom: 1px solid #f1f5f9; }
        .lvl-1 a { display: flex; justify-content: space-between; padding: 14px 20px; text-decoration: none; color: #334155 !important; font-size: 13px; font-weight: 600; }
        .search-area { flex-grow: 1; position: relative; }
        .search-area input { width: 100%; padding: 12px 15px 12px 45px; border-radius: 8px; border: 1px solid #d1d5db; background: #f9fafb; }
        .search-area i { position: absolute; left: 16px; top: 14px; color: #9ca3af; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; flex: 1; width: 100%; }
        .bento-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .slider-wrapper { flex: 7; border-radius: 12px; overflow: hidden; }
        .slider-wrapper img { width: 100%; aspect-ratio: 21/9; object-fit: cover; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 15px; text-decoration: none; color: inherit; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; }
        .card-title { font-size: 13px; font-weight: 600; margin: 10px 0; height: 55px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
    </style>
</head>
<body>
<header>
    <div class="header-wrap">
        <div class="logo-area"><img src="https://scontent.fcgk33-1.fna.fbcdn.net/v/t39.30808-6/624198570_880283444966914_4381555066372612860_n.jpg?_nc_cat=110&amp;ccb=1-7&amp;_nc_sid=1d70fc&amp;_nc_eui2=AeG_fTwdP9RssOprpQ-l1RIBvrHYblWRiiq-sdhuVZGKKjhNdhacRlYdnYnlT4w94sk&amp;_nc_ohc=6ZM8ldpgrcYQ7kNvwG8A4gV&amp;_nc_oc=Adr4FLg4oZgI6uTvL0bRSC0qjz55Rd10OSjnXL_6hTJqfy2YT6BnLvKse8Vr3ZKi4IdeIWu508BG8uM7oUCHyqZb&amp;_nc_zt=23&amp;_nc_ht=scontent.fcgk33-1.fna&amp;_nc_gid=ksMn_6bp-H9B4pKgByD64A&amp;_nc_ss=7a3a8&amp;oh=00_Af283IjfJzTlROcNu3eUjp9H86TRYJT23ByZygYxNDmW8w&amp;oe=69D811CB"></div>
        <div class="nav-item" id="navBungkus">
            <button class="btn-kategori" onclick="toggleMenu()"><i class="fas fa-bars"></i> KATEGORI</button>
            <div class="mega-menu">
                                    <div class="lvl-1"><a>Kesehatan</a></div>
                            </div>
        </div>
        <div class="search-area"><i class="fas fa-search"></i><input type="text" placeholder="Cari produk..."></div>
    </div>
</header>
<div class="container">
        <div class="bento-container">
        <div class="slider-wrapper"><img src="https://lh3.googleusercontent.com/d/188l9H6fSy5f4QypFQEghLBMMUw14qgLv"></div>
    </div>
        <div class="grid">
                    <a href="1-pack-isi-12-pcs-pasta-gigi-ciptadent-75-gram-edisi-beli-5-gratis-1/index.html" class="card">
                <img src="https://down-id.img.susercontent.com/file/id-11134207-7ra0n-mb88ncm4fbh2a5@resize_w450_nl.webp">
                <div class="card-title">1 PACK ISI 12 PCS PASTA GIGI CIPTADENT 75 GRAM EDISI BELI 5 GRATIS 1</div>
            </a>
            </div>
</div>
<script>
    function toggleMenu() { document.getElementById('navBungkus').classList.toggle('show-menu'); }
</script>
</body>
</html>
