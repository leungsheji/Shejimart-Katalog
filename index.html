<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheji Mart - Katalog Resmi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #0d6efd; --bg: #f8fafc; --footer: #1e293b; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin:0; padding-top: 100px; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* HEADER */
        header { position: fixed; top: 0; width: 100%; background: #ffffff; z-index: 10000; border-bottom: 2px solid #edf2f7; height: 85px; }
        .header-wrap { display: flex; align-items: center; padding: 0 5%; gap: 20px; max-width: 1400px; margin: 0 auto; height: 100%; }
        .logo-area img { height: 80px; width: auto; object-fit: contain; }
        
        /* TOMBOL KATEGORI */
        .nav-item { position: relative; flex-shrink: 0; z-index: 10001; }
        .btn-kategori { background: #0d6efd !important; color: #fff !important; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; min-width: 150px; justify-content: center; }
        .mega-menu { display: none; position: absolute; top: 100%; left: 0; background: #fff; min-width: 250px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 1px solid #e2e8f0; border-radius: 0 0 8px 8px; margin-top: 5px; }
        .nav-item.show-menu .mega-menu { display: block; }
        .lvl-1 { position: relative; border-bottom: 1px solid #f1f5f9; }
        .lvl-1 a { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; text-decoration: none; color: #334155; font-size: 13px; font-weight: 600; cursor: pointer; }
        .lvl-2-wrap, .lvl-3-wrap { display: none; position: absolute; left: 100%; top: 0; background: #fff; min-width: 250px; border-left: 1px solid #e2e8f0; }
        .lvl-1:hover .lvl-2-wrap, .lvl-2:hover .lvl-3-wrap { display: block; }

        .search-area { flex-grow: 1; position: relative; }
        .search-area input { width: 100%; padding: 12px 45px; border-radius: 8px; border: 1px solid #d1d5db; background: #f9fafb; outline: none; }
        .search-area i { position: absolute; left: 16px; top: 14px; color: #9ca3af; }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; flex: 1; width: 100%; }
        .bento-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .slider-wrapper { flex: 7; overflow: hidden; border-radius: 12px; }
        .slide img { width: 100%; aspect-ratio: 21/9; max-height: 380px; object-fit: cover; }
        .side-banners { flex: 3; display: flex; flex-direction: column; gap: 20px; }
        .side-banner img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }

        /* GRID PRODUK */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 15px; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; }
        .card-title { font-size: 13px; font-weight: 600; margin: 10px 0; min-height: 38px; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }

        /* DETAIL PRODUK - HARGA RAKSASA */
        #modalDetail { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 20000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #fff; width: 100%; max-width: 850px; border-radius: 16px; display: flex; overflow: hidden; position: relative; }
        .modal-left { flex: 1; background: #f8fafc; padding: 30px; display: flex; align-items: center; justify-content: center; }
        .modal-left img { max-width: 100%; max-height: 350px; object-fit: contain; }
        .modal-right { flex: 1.2; padding: 35px; overflow-y: auto; }
        .price-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; margin-bottom: 20px; }
        .price-label { font-size: 16px; font-weight: 600; color: #64748b; }
        .det-price { font-size: 32px; font-weight: 800; color: #10b981; } /* HARGA RAKSASA */
        .desc-label { font-weight: 800; color: #1e293b; margin-bottom: 5px; display: block; }
        .det-desc { font-size: 14px; color: #475569; line-height: 1.6; margin-bottom: 25px; white-space: pre-wrap; }
        .btn-buy { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 700; margin-bottom: 10px; }
        .btn-wa-main { background: #22c55e; color: #fff; }
        .market-btn { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
        .disclaimer { font-size: 12px; color: #334155; font-weight: 700; font-style: italic; background: #f1f5f9; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #e2e8f0; }

        /* FOOTER LENGKAP */
        footer { background: var(--footer); color: #cbd5e1; padding: 60px 5% 40px; margin-top: 50px; }
        .ft-floor-2 { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1.5fr; gap: 40px; max-width: 1400px; margin: 0 auto; }
        .ft-box h4 { color: #fff; margin-bottom: 25px; font-size: 18px; border-left: 4px solid #fff; padding-left: 15px; line-height: 1; }
        .ft-box a, .ft-box p { font-size: 14px; color: #cbd5e1; text-decoration: none; display: block; margin-bottom: 12px; }
        .info-item { display: flex; gap: 12px; margin-bottom: 15px; }
        .info-item i { color: #fff; margin-top: 3px; }
        .btn-maps-ft { background: #007bff; color: #fff !important; text-align: center; padding: 12px; border-radius: 6px; font-weight: 700; display: block; text-decoration: none; }

        @media (max-width: 768px) { body { padding-top: 140px; } .header-wrap { flex-wrap: wrap; height: auto; } .modal-content { flex-direction: column; max-height: 95vh; } .ft-floor-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header>
    <div class="header-wrap">
        <div id="logoPlace" class="logo-area"></div>
        <div class="nav-item" id="navBungkus">
            <button class="btn-kategori" id="btnKategori"><i class="fas fa-bars"></i> KATEGORI</button>
            <div class="mega-menu" id="menuKonten"></div>
        </div>
        <div class="search-area">
            <i class="fas fa-search"></i>
            <input type="text" id="cari" placeholder="Cari produk..." onkeyup="filterCepat()">
        </div>
    </div>
</header>

<div class="container">
    <div id="banner-area"></div>
    <div class="grid" id="produkGrid"><p style="grid-column:1/-1;text-align:center;padding:50px;">Menghubungkan...</p></div>
</div>

<div id="modalDetail">
    <div class="modal-content">
        <span style="position:absolute;top:15px;right:20px;font-size:28px;cursor:pointer;color:#64748b;z-index:10" onclick="tutupDetail()">&times;</span>
        <div class="modal-left"><img id="detImg" src=""></div>
        <div class="modal-right">
            <h2 id="detTitle" style="font-size:20px;font-weight:800;margin-bottom:15px;"></h2>
            <div id="detPriceArea"></div>
            <div id="detDescContainer"></div>
            <div id="btnGroup" style="display:flex;flex-direction:column;gap:10px;"></div>
        </div>
    </div>
</div>

<footer id="footerArea" style="display:none;">
    <div class="ft-floor-2">
        <div class="ft-box"><h4 id="ftNamaToko"></h4><p id="ftDeskripsi"></p></div> 
        <div class="ft-box"><h4>Bantuan</h4><a onclick="location.reload()">Beranda</a><a id="waFooter" target="_blank">Hubungi Kami</a></div>
        <div class="ft-box"><h4>Ikuti Kami</h4><div id="socialArea"></div></div>
        <div class="ft-box">
            <h4>Info Toko</h4>
            <div class="info-item"><i class="fas fa-map-marker-alt"></i> <span id="txtAlamat"></span></div>
            <a id="btnMaps" target="_blank" class="btn-maps-ft">Buka Google Maps</a>
        </div>
    </div>
</footer>

<script>
    const API = 'https://script.google.com/macros/s/AKfycbwjuZLOZ0Dutly-M4AGVfebOuXVux783QbawpymuxbG5k2WUch6lcFZXV7xGB9ZQ9A/exec?action=katalog&owner=bos_budi';
    let database = [], config = {};

    async function init() {
        try {
            const r = await fetch(API);
            const res = await r.json();
            if(res.status === "sukses") {
                database = res.data; config = res.config;
                renderWeb(); renderNav(res.categories); renderItem(database); renderFooter();
            }
        } catch (e) { document.getElementById('produkGrid').innerHTML = "Gagal memuat data."; }
    }

    function renderItem(list) {
        document.getElementById('produkGrid').innerHTML = list.map((p, idx) => `
            <div class="card" onclick="bukaDetail(${idx})">
                <img src="${p.link_gambar}"><div class="card-title">${p.nama}</div>
            </div>`).join('');
    }

    function bukaDetail(idx) {
        const p = database[idx];
        document.getElementById('detImg').src = p.link_gambar;
        document.getElementById('detTitle').innerText = p.nama;
        document.getElementById('detPriceArea').innerHTML = `<div class="price-row"><span class="price-label">Harga Jual Offline</span><span class="det-price">Rp ${p.harga_offline.toLocaleString('id-ID')}</span></div>`;
        document.getElementById('detDescContainer').innerHTML = `<span class="desc-label">Deskripsi :</span><div class="det-desc">${p.deskripsi}</div>`;
        
        let btns = `<a href="https://wa.me/${config.noWa}?text=${encodeURIComponent(config.pesanWa + p.nama)}" target="_blank" class="btn-buy btn-wa-main"><i class="fab fa-whatsapp"></i> BELI VIA WHATSAPP</a>`;
        if(p.list_links) {
            p.list_links.forEach(l => {
                let col = l.platform==='blibli'?'#0095da':(l.platform==='shopee'?'#ee4d2d':'#03ac0e');
                btns += `<a href="${l.url}" target="_blank" class="btn-buy market-btn"><i class="fas fa-shopping-bag" style="color:${col}"></i> Beli di ${l.toko}</a>`;
            });
        }
        btns += `<div class="disclaimer">Note : Harga Jual bisa berbeda-beda pada masing-masing Marketplace</div>`;
        document.getElementById('btnGroup').innerHTML = btns;
        document.getElementById('modalDetail').style.display = 'flex';
    }

    function renderFooter() {
        document.getElementById('footerArea').style.display = 'block';
        document.getElementById('ftNamaToko').innerText = config.namaToko;
        document.getElementById('ftDeskripsi').innerHTML = config.htmlFooter2 || "Pusat grosir dan eceran terpercaya.";
        document.getElementById('txtAlamat').innerText = config.alamat;
        document.getElementById('waFooter').href = "https://wa.me/" + config.noWa;
        document.getElementById('btnMaps').href = config.maps;
        if(config.socialLinks) {
            document.getElementById('socialArea').innerHTML = config.socialLinks.split(",").map(s => {
                const p = s.split("|"); return `<a href="${p[1]}" target="_blank">${p[0]}</a>`;
            }).join('');
        }
    }

    function renderWeb() {
        document.documentElement.style.setProperty('--primary', config.themeColor || '#0d6efd');
        document.getElementById('logoPlace').innerHTML = config.linkLogo ? `<img src="${config.linkLogo}">` : `<h2>${config.namaToko}</h2>`;
        if(config.slide1) {
            document.getElementById('banner-area').innerHTML = `<div class="bento-container"><div class="slider-wrapper ${!config.sAtas?'full-width':''}"><div class="slide" style="display:block"><img src="${config.slide1}"></div></div>${config.sAtas?`<div class="side-banners"><div class="side-banner"><img src="${config.sAtas}"></div></div>`:''}</div>`;
        }
    }

    function renderNav(p) {
        let h = '';
        for(let k in p) {
            h += `<div class="lvl-1"><a>${k} <i class="fas fa-chevron-right" style="font-size:10px"></i></a><div class="lvl-2-wrap">`;
            for(let s in p[k]) {
                h += `<div class="lvl-2"><a>${s} <i class="fas fa-chevron-right" style="font-size:10px"></i></a><div class="lvl-3-wrap">`;
                p[k][s].forEach(j => { h += `<a onclick="filterKat('${j}')">${j}</a>`; });
                h += `</div></div>`;
            }
            h += `</div></div>`;
        }
        document.getElementById('menuKonten').innerHTML = h;
    }

    function tutupDetail() { document.getElementById('modalDetail').style.display = 'none'; }
    function filterKat(v) { renderItem(database.filter(p => p.jenis === v)); }
    function filterCepat() { const k = document.getElementById('cari').value.toLowerCase(); renderItem(database.filter(p => p.nama.toLowerCase().includes(k))); }
    document.getElementById('btnKategori').onclick = (e) => { e.stopPropagation(); document.getElementById('navBungkus').classList.toggle('show-menu'); };
    init();
</script>
</body>
</html>
